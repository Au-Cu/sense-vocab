<!doctype html>
<html lang="zh-CN">
  <body style="margin:0;background:#f4f6f5;color:#182328;font-family:Arial,'Microsoft YaHei',sans-serif;">
    <div style="max-width:520px;margin:32px auto;padding:28px;background:#fff;border:1px solid #d8ddd9;">
      <h1 style="margin:0 0 16px;font-size:22px;">密码重设验证码</h1>
      <p style="margin:0 0 20px;line-height:1.7;color:#63717b;">
        请在背词账户找回密码页面输入下面的验证码。验证码 10 分钟内有效。
      </p>
      <p style="margin:0 0 20px;font-size:34px;font-weight:700;letter-spacing:6px;color:#0f766e;">
        {{ .Token }}
      </p>
      <p style="margin:0;line-height:1.7;color:#63717b;">
        如果不是你发起的密码重设，请忽略本邮件，不要向任何人透露验证码。
      </p>
    </div>
  </body>
</html>
